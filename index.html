<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AC Goes Bowling Scorecard</title>
<style>
:root{--navy:#1e3a8a;--blue:#2563eb;--blue2:#3b82f6;--edge:#60a5fa;--pale:#bfdbfe;--gold:#facc15;--cream:#fef9c3;--ink:#111827;--grn:#22c55e;--red:#dc2626;--mute:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--navy)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.2;color:var(--ink);padding:16px;position:relative;min-height:100vh;overflow-x:hidden}
.board{position:relative;overflow:hidden}
.wm{position:absolute;left:50%;top:50%;width:min(50%,640px);aspect-ratio:1/1;transform:translate(-50%,-50%);opacity:.2;pointer-events:none;object-fit:contain;z-index:0}
.board>:not(.wm){position:relative;z-index:1}
.scroll{overflow-x:auto}
.wrap{max-width:1200px;margin:0 auto;position:relative}
.card{background:var(--blue);border:4px solid var(--edge);border-radius:10px;padding:16px}
.hdr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;margin-bottom:10px;min-height:80px}
#name{font-family:inherit;font-size:26px;font-weight:800;color:#fff;background:transparent;border:0;outline:0;width:100%;min-width:0}
.series{text-align:right;color:#fff}
.series .l{font-size:13px;color:var(--pale);letter-spacing:.05em}
#series{font-size:40px;font-weight:800;color:var(--gold)}
#games{font-size:12px;color:var(--pale);min-height:14px}
.sheet{display:grid;grid-template-columns:repeat(9,1fr) 1.5fr;min-width:640px;background:#fff}
.fr{border:2px solid var(--ink);display:flex;flex-direction:column;background:#fff}
.fr.on{border-color:var(--gold)}
.fn{text-align:center;font-weight:700;padding:4px 0;border-bottom:2px solid var(--ink)}
.pd{background:#000;display:flex;justify-content:center;align-items:center;gap:3px;height:36px;cursor:pointer}
.mini{width:26px;height:26px}
.mini.s{width:22px;height:22px}
.bx{display:grid;grid-template-columns:1fr 1fr;border-bottom:2px solid var(--ink)}
.ten .bx{grid-template-columns:1fr 1fr 1fr}
.b{border-right:1px solid var(--ink);font-weight:700;font-size:18px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.b:last-child{border-right:0}
.b:hover{background:#eff6ff}
.b.ed{box-shadow:inset 0 0 0 3px var(--gold)}
.sp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid var(--red);border-radius:50%;color:var(--red)}
.sc{text-align:center;font-weight:800;font-size:22px;height:44px;line-height:44px;background:#fff}
.fr.on .sc{background:var(--cream)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pins{background:var(--cream);border-color:var(--ink)}
h2{font-size:22px;font-weight:700;margin-bottom:6px}
.pad h2{color:#fff;text-align:center}
#hint{font-size:14px;color:var(--mute);font-weight:600}
.rack{position:relative;width:220px;height:214px;margin:18px auto 6px}
.pin{position:absolute;width:46px;height:46px;border-radius:50%;border:4px solid #9ca3af;background:#d1d5db;color:#6b7280;font-weight:700;font-size:18px;opacity:.55;cursor:pointer}
.pin.up{background:#fff;border-color:#4b5563;color:var(--ink);opacity:1}
.pin.cv{background:var(--grn);border-color:#15803d;color:#fff;opacity:1}
.pin.gone{opacity:.15;cursor:default}
.pin:disabled{cursor:default}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.k{background:var(--blue2);color:#fff;border:2px solid #93c5fd;border-radius:8px;font-family:inherit;font-weight:700;font-size:22px;padding:14px 0;cursor:pointer}
.k:hover:not(:disabled){background:#1d4ed8}
.k:disabled{background:var(--mute);border-color:#9ca3af;opacity:.45;cursor:not-allowed}
.btn{width:100%;border:2px solid;border-radius:8px;font-family:inherit;font-weight:700;font-size:17px;padding:12px;color:#fff;cursor:pointer;margin-top:8px}
.btn:disabled{background:var(--mute)!important;border-color:#9ca3af!important;opacity:.6;cursor:not-allowed}
.red{background:var(--red);border-color:#f87171}
.slate{background:#475569;border-color:#94a3b8}
.green{background:#16a34a;border-color:#4ade80}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;justify-content:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.actions .btn{width:auto;padding:12px 28px;margin:0}
.players{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%;margin-top:4px}
.players .l{color:var(--pale);font-weight:700;font-size:14px;letter-spacing:.05em}
.pl{border:2px solid #94a3b8;background:#475569;color:#fff;border-radius:8px;font-family:inherit;font-weight:700;font-size:15px;padding:9px 14px;cursor:pointer;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.on{background:var(--gold);border-color:#fde047;color:var(--ink)}
.pl.add{background:#16a34a;border-color:#4ade80}
.pl.rm{background:var(--red);border-color:#f87171}
.pl:disabled{opacity:.45;cursor:not-allowed}
html.strip,html.strip body{background:transparent;padding:0;margin:0;height:100%;min-height:0;overflow:hidden}
html.strip .row,html.strip .actions{display:none}
html.strip .wrap{position:absolute;left:0;top:0;width:1200px;max-width:none;margin:0;transform-origin:0 0}
[hidden]{display:none!important}
@media (max-width:760px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <section class="card board">
    <img id="wm" class="wm" alt="" hidden>
    <div class="hdr">
      <input id="name" aria-label="Player name" autocomplete="off">
      <div class="series"><div class="l">SERIES TOTAL</div><div id="series">0</div><div id="games"></div></div>
    </div>
    <div class="scroll"><div id="sheet" class="sheet"></div></div>
  </section>

  <div class="row">
    <section class="card pins">
      <h2>Pin Leave</h2>
      <div id="hint"></div>
      <div id="rack" class="rack"></div>
    </section>
    <section class="card pad">
      <h2 id="padTitle"></h2>
      <div id="keys" class="keys"></div>
      <button id="splitBtn" class="btn red">Mark as Split</button>
      <div class="two">
        <button id="allPins" class="btn slate">All Pins</button>
        <button id="clearPins" class="btn slate">Clear Pins</button>
      </div>
      <div id="liveRow"><button id="undoBtn" class="btn slate">Undo Last Ball</button></div>
      <div id="editRow" class="two" hidden>
        <button id="savePins" class="btn green">Save Pins Only</button>
        <button id="cancelBtn" class="btn slate">Cancel Edit</button>
      </div>
    </section>
  </div>

  <div class="actions">
    <button id="nextBtn" class="btn green">Next Game</button>
    <button id="resetGame" class="btn slate">Reset Game</button>
    <button id="resetSeries" class="btn red">Reset Series</button>
    <div id="players" class="players"></div>
  </div>
</div>

  function done(i, b) {

    if (v === undefined) return '';
    if (mode(9, b, bl) === 'rack') return v === 10 ? 'X' : v === 0 ? '-' : v;
    return bl[b - 1] + v === 10 ? '/' : v === 0 ? '-' : v;
  }

  function renderSheet() {
    const sc = scores(), cur = cursor();
    let h = '';
    for (let i = 0; i < 10; i++) {
      const fr = S.frames[i];
      h += '<div class="fr' + (cur && cur.f === i ? ' on' : '') + (i === 9 ? ' ten' : '') + '">' +
           '<div class="fn">' + (i + 1) + '</div>' +
           '<div class="pd" data-pd="' + i + '">' + racksSvg(i) + '</div><div class="bx">';
      for (let b = 0; b < (i < 9 ? 2 : 3); b++) {
        const ed = edit && edit.f === i && (edit.b === b || (i < 9 && fr.balls[0] === 10 && b === 1));
        const m = mark(i, b);
        const sp = i < 9 && b === 0 && fr.split && m !== '';
        h += '<div class="b' + (ed ? ' ed' : '') + '" data-b="' + i + ',' + b + '">' +
             (sp ? '<span class="sp">' + m + '</span>' : m) + '</div>';
      }
      h += '</div><div class="sc">' + (sc[i] === null ? '' : sc[i]) + '</div></div>';
    }
    $('sheet').innerHTML = h;
  }

  function renderRack() {
    const r = rackInfo();
    let h = '';
    for (const p of PINS) {
      const [x, y] = BIG[p];
      let cls = 'pin', dis = !r;
      if (r) {
        if (r.m === 'rack') { if (sel.includes(p)) cls += ' up'; }
        else if (!r.avail.includes(p)) { cls += ' gone'; dis = true; }
        else cls += sel.includes(p) ? ' cv' : ' up';
      }
      h += '<button class="' + cls + '" data-p="' + p + '" style="left:' + (x * 58) + 'px;top:' + (y * 56) + 'px"' +
           (dis ? ' disabled' : '') + '>' + p + '</button>';
    }
    $('rack').innerHTML = h;
    $('hint').textContent = !r ? 'Game complete' : r.m === 'rack' ? 'Tap pins LEFT STANDING' : 'Tap pins CONVERTED';
  }

  function renderPad() {
    const r = rackInfo();
    $('padTitle').textContent = edit ? 'Editing Frame ' + (edit.f + 1) + ', Roll ' + (edit.b + 1)
      : r ? 'Frame ' + (r.t.f + 1) + ' - Roll ' + (r.t.b + 1) : 'Game Complete';
    let lo = 1, hi = 0;
    if (r) [lo, hi] = range(r.t.f, r.t.b, r.fr.balls, sel.length);
    let h = '';
    for (let v = 0; v <= 10; v++) {
      let lab = v === 0 ? '-' : v;
      if (r && r.m === 'conv' && v === r.cap) lab = '/';
      else if (v === 10) lab = 'X';
      h += '<button class="k" data-v="' + v + '"' + (v < lo || v > hi ? ' disabled' : '') + '>' + lab + '</button>';
    }
    $('keys').innerHTML = h;

    const sf = r && r.t.f < 9 && r.fr.balls.length && r.fr.balls[0] < 10 ? r.fr : null;
    $('splitBtn').disabled = !sf;
    $('splitBtn').textContent = sf && sf.split ? 'Split Marked \u2713' : 'Mark as Split';
    $('allPins').disabled = $('clearPins').disabled = !r;
    $('editRow').hidden = !edit;
    $('liveRow').hidden = !!edit;
    if (edit) {
      const [l2, h2] = range(edit.f, edit.b, r.fr.balls, sel.length);
      const v = r.fr.balls[edit.b];
      $('savePins').disabled = v < l2 || v > h2;
    }
    $('undoBtn').disabled = !S.frames.some(f => f.balls.length);
  }

  function render() {
    renderSheet(); renderRack(); renderPad();
    $('series').textContent = S.games.reduce((a, g) => a + g, 0);
    $('games').textContent = S.games.map((g, i) => 'G' + (i + 1) + ' ' + g).join('  |  ');
    $('nextBtn').disabled = !!cursor();
    renderPlayers();
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'})[c]);
  function renderPlayers() {
    let h = '<span class="l">PLAYER</span>';
    DB.players.forEach((p, i) => {
      h += '<button class="pl' + (i === DB.active ? ' on' : '') + '" data-pl="' + i + '" title="' + esc(p.name) + '">' +
           (i + 1) + '. ' + esc(p.name || 'PLAYER') + '</button>';
    });
    h += '<button class="pl add" data-act="add">+ Add Player</button>' +
         '<button class="pl rm" data-act="rm"' + (DB.players.length < 2 ? ' disabled' : '') + '>' +
         (rmArmed ? 'Confirm Remove ' + esc(S.name) + '?' : 'Remove Player') + '</button>';
    $('players').innerHTML = h;
  }

  /* ---------- actions ---------- */
  function record(v) {
    const r = rackInfo();
    if (!r) return;
    const [lo, hi] = range(r.t.f, r.t.b, r.fr.balls, sel.length);
    if (v < lo || v > hi) return;
    const fr = r.fr, b = r.t.b;
    fr.balls[b] = v;
    if (r.m === 'conv' && v === r.cap && r.avail !== PINS) fr.leaves[b] = r.avail.slice(); // spare: all converted
    else if (r.m === 'rack' && v === 10) fr.leaves[b] = [];
    else fr.leaves[b] = sel.slice();
    sanitize(r.t.f);
    edit = null; sel = [];
    save(); render();
  }
  function togglePin(p) {
    const r = rackInfo();
    if (!r) return;
    const i = sel.indexOf(p);
    if (i >= 0) sel.splice(i, 1);
    else {
      if (r.m === 'conv' && (!r.avail.includes(p) || sel.length >= r.cap)) return;
      sel.push(p);
    }
    renderRack(); renderPad();
  }
  function startEdit(f, b) {
    edit = {f, b};
    sel = (S.frames[f].leaves[b] || []).slice();
    render();
  }
  function cancel() { edit = null; sel = []; render(); }
  function savePins() {
    if (!edit) return;
    const fr = S.frames[edit.f], [lo, hi] = range(edit.f, edit.b, fr.balls, sel.length), v = fr.balls[edit.b];
    if (v < lo || v > hi) return;
    fr.leaves[edit.b] = sel.slice();
    sanitize(edit.f);
    edit = null; sel = [];
    save(); render();
  }
  function undo() {
    edit = null; sel = [];
    for (let i = 9; i >= 0; i--) {
      const fr = S.frames[i];
      if (fr.balls.length) {
        fr.balls.pop();
        fr.leaves.length = fr.balls.length;
        if (!(i < 9 && fr.balls.length && fr.balls[0] < 10)) fr.split = false;
        break;
      }
    }
    save(); render();
  }
  function switchPlayer(i) {
    if (i < 0 || i >= DB.players.length) return;
    DB.active = i; S = DB.players[i];
    edit = null; sel = []; rmArmed = false;
    $('name').value = S.name;
    save(); render();
  }
  function addPlayer() {
    DB.players.push(newPlayer('PLAYER ' + (DB.players.length + 1)));
    switchPlayer(DB.players.length - 1);
  }
  function removePlayer() {
    if (DB.players.length < 2) return;
    if (!rmArmed) { rmArmed = true; renderPlayers(); return; }
    DB.players.splice(DB.active, 1);
    switchPlayer(Math.min(DB.active, DB.players.length - 1));
  }
  function newGame(keepSeries) {
    if (!keepSeries) S.games = [];
    S.frames = blank(); edit = null; sel = [];
    save(); render();
  }

  /* ---------- events ---------- */
  $('sheet').addEventListener('click', e => {
    const bx = e.target.closest('[data-b]');
    if (bx) {
      let [f, b] = bx.dataset.b.split(',').map(Number);
      const bl = S.frames[f].balls;
      if (f < 9 && bl[0] === 10) b = 0;
      if (b >= bl.length) return;
      if (edit && edit.f === f && edit.b === b) cancel(); else startEdit(f, b);
      return;
    }
    const pd = e.target.closest('[data-pd]');
    if (pd) {
      const f = +pd.dataset.pd, bl = S.frames[f].balls;
      if (bl.length) startEdit(f, bl.length - 1);
    }
  });
  $('rack').addEventListener('click', e => { const p = e.target.closest('[data-p]'); if (p && !p.disabled) togglePin(+p.dataset.p); });
  $('keys').addEventListener('click', e => { const k = e.target.closest('[data-v]'); if (k && !k.disabled) record(+k.dataset.v); });
  $('splitBtn').addEventListener('click', () => {
    const r = rackInfo();
    if (r && r.t.f < 9 && r.fr.balls.length && r.fr.balls[0] < 10) { r.fr.split = !r.fr.split; save(); render(); }
  });
  $('allPins').addEventListener('click', () => {
    const r = rackInfo();
    if (!r) return;
    if (r.m === 'rack') sel = PINS.slice();
    else if (r.avail.length <= r.cap) sel = r.avail.slice();
    renderRack(); renderPad();
  });
  $('clearPins').addEventListener('click', () => { sel = []; renderRack(); renderPad(); });
  $('undoBtn').addEventListener('click', undo);
  $('savePins').addEventListener('click', savePins);
  $('cancelBtn').addEventListener('click', cancel);
  $('nextBtn').addEventListener('click', () => {
    const sc = scores();
    if (cursor() || sc[9] === null) return;
    S.games.push(sc[9]);
    newGame(true);
  });
  $('resetGame').addEventListener('click', () => newGame(true));
  $('resetSeries').addEventListener('click', () => newGame(false));
  $('name').addEventListener('input', e => { S.name = e.target.value; save(); renderPlayers(); });
  $('players').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.pl !== undefined) switchPlayer(+b.dataset.pl);
    else if (b.dataset.act === 'add') addPlayer();
    else if (b.dataset.act === 'rm') removePlayer();
  });
  document.addEventListener('click', e => {   // clicking anywhere else cancels a pending remove
    if (rmArmed && !e.target.closest('[data-act="rm"]')) { rmArmed = false; renderPlayers(); }
  });

  // Keyboard: 0-9, '-' gutter, 'x' strike, '/' spare, Backspace undo, Esc cancel edit
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (k >= '0' && k <= '9' && k.length === 1) record(+k);
    else if (k === '-') record(0);
    else if (k === 'x' || k === 'X') record(10);
    else if (k === '/') { const r = rackInfo(); if (r && r.m === 'conv') record(r.cap); }
    else if (k === 'Backspace') undo();
    else if (k === 'Escape') cancel();
    else return;
    e.preventDefault();
  });

  /* ---------- one URL, two looks ----------
     A wide, short box (like a phone streaming-app layer) shows only the scorecard strip and
     follows the scores sent from the laptop. A normal window shows the full page and sends. */
  const TOPIC = 'https://ntfy.sh/acgb-s1ey3c93zu320bqf4duko5h4';
  const forced = new URLSearchParams(location.search).get('view');
  const isStrip = () => forced ? forced === 'strip' : (innerWidth / innerHeight >= 3 || innerHeight < 250);
  var strip = isStrip(), listening = false, remote = false;

  function fit() {
    const now = isStrip();
    if (now !== strip) { strip = now; applyMode(); return; }
    const w = $('wrap');
    if (!strip) { w.style.transform = ''; w.style.width = ''; return; }
    // reshape the card to the box's proportions (frames widen or narrow), then scale it to fill the box
    w.style.transform = ''; w.style.width = '1200px';
    let H = w.offsetHeight;
    // between 720 and 1700 wide the card reshapes to the box and fills it; outside that it keeps a sane shape and centers
    const want = innerWidth * H / innerHeight, W = Math.min(1700, Math.max(720, want));
    w.style.width = W + 'px';
    H = w.offsetHeight;
    const kx = innerWidth / W, ky = innerHeight / H;
    if (want >= 720 && want <= 1700) w.style.transform = 'scale(' + kx + ',' + ky + ')';
    else { const k = Math.min(kx, ky); w.style.transform = 'translate(' + (innerWidth - W * k) / 2 + 'px,' + (innerHeight - H * k) / 2 + 'px) scale(' + k + ')'; }
  }
  function applyMode() {
    document.documentElement.classList.toggle('strip', strip);
    if (strip) listen();
    fit();
  }
  addEventListener('resize', fit);

  // sending (full page): only the shown player's game, at most every 1.5 s
  let sendTimer = null, lastSent = 0;
  function publish() {
    if (strip) return;
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => {
      let body = JSON.stringify({v: 1, p: S});
      if (body.length > 3900) body = JSON.stringify({v: 1, p: Object.assign({}, S, {frames: S.frames.map(f => ({balls: f.balls, leaves: [], split: f.split}))})});
      lastSent = Date.now();
      try { fetch(TOPIC, {method: 'POST', body}).catch(() => {}); } catch (e) {}
    }, Math.max(300, 1500 - (Date.now() - lastSent)));
  }

  // receiving (overlay strip)
  function show(text) {
    try {
      const d = JSON.parse(text);
      if (!d || d.v !== 1 || !d.p || !Array.isArray(d.p.frames) || d.p.frames.length !== 10) return;
      S = {name: d.p.name || '', frames: d.p.frames, games: Array.isArray(d.p.games) ? d.p.games : []};
      remote = true; edit = null; sel = [];
      $('name').value = S.name;
      render(); fit();
    } catch (e) {}
  }
  function latest() {
    if (typeof fetch !== 'function') return;
    fetch(TOPIC + '/json?poll=1&since=latest').then(r => r.text()).then(t => {
      const lines = t.trim().split('\n').filter(Boolean);
      for (const l of lines) { try { const m = JSON.parse(l); if (m.event === 'message') show(m.message); } catch (e) {} }
    }).catch(() => {});
  }
  function listen() {
    if (listening) return;
    listening = true;
    latest();
    try {
      const es = new EventSource(TOPIC + '/sse');
      es.onopen = latest;                        // catch up after any reconnect
      es.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === 'message') show(m.message); } catch (x) {} };
    } catch (e) {}
  }

  load();
  $('name').value = S.name;
  render();
  applyMode();

})();
</script>
</body>
</html>
